name: Build NBC Android APKs

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Install Android SDK 35
        run: |
          SDKMANAGER="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin/sdkmanager"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" "platforms;android-35" "build-tools;35.0.0" "platform-tools"
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'
      - name: Build Passenger and Operations APKs
        working-directory: NBC_Android_Apps
        run: gradle --no-daemon assemblePassengerDebug assembleOperationsDebug
      - name: Upload APKs
        uses: actions/upload-artifact@v4
        with:
          name: NBC-Android-Apps-v1.8.0-API-v9.12.2
          path: |
            NBC_Android_Apps/app/build/outputs/apk/passenger/debug/app-passenger-debug.apk
            NBC_Android_Apps/app/build/outputs/apk/operations/debug/app-operations-debug.apk
          if-no-files-found: error
